name: originpulse

x-originpulse-environment: &originpulse-environment
  DATABASE_URL: "postgres://${POSTGRES_USER:-originpulse}:${POSTGRES_PASSWORD:-originpulse_dev_password}@postgres:5432/${POSTGRES_DB:-originpulse}?sslmode=disable&require_auth=scram-sha-256"
  ORIGINPULSE_CONFIG: /app/config.yml
  PANTHEON_EMAIL: ${PANTHEON_EMAIL:-}
  PANTHEON_MACHINE_TOKEN: ${PANTHEON_MACHINE_TOKEN:-}
  MAXMIND_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:-}
  MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:12b}
  OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-10m}
  ORIGINPULSE_SMTP_USERNAME: ${ORIGINPULSE_SMTP_USERNAME:-}
  ORIGINPULSE_SMTP_PASSWORD: ${ORIGINPULSE_SMTP_PASSWORD:-}
  ORIGINPULSE_PUSH_WEBHOOK_URLS: ${ORIGINPULSE_PUSH_WEBHOOK_URLS:-}
  ORIGINPULSE_VAPID_PUBLIC_KEY: ${ORIGINPULSE_VAPID_PUBLIC_KEY:-}
  ORIGINPULSE_VAPID_PRIVATE_KEY: ${ORIGINPULSE_VAPID_PRIVATE_KEY:-}
  ORIGINPULSE_VAPID_SUBJECT: ${ORIGINPULSE_VAPID_SUBJECT:-mailto:originpulse@localhost}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-originpulse-service: &originpulse-service
  build:
    context: ..
    dockerfile: docker/Dockerfile
    pull: true
  image: originpulse:local
  restart: unless-stopped
  init: true
  read_only: true
  environment: *originpulse-environment
  volumes:
    - type: bind
      source: ../config.yml
      target: /app/config.yml
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../tmp
      target: /app/tmp
      read_only: true
      bind:
        create_host_path: false
    - originpulse_data:/app/data
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 20s
  extra_hosts:
    - host.docker.internal:host-gateway
  depends_on:
    postgres:
      condition: service_healthy
      restart: true

services:
  postgres:
    image: postgres:18.6-trixie@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
    restart: unless-stopped
    stop_grace_period: 1m
    shm_size: "1gb"
    command:
      - "postgres"
      - "-c"
      - "max_wal_size=${POSTGRES_MAX_WAL_SIZE:-8GB}"
      - "-c"
      - "checkpoint_timeout=${POSTGRES_CHECKPOINT_TIMEOUT:-15min}"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "io_method=${POSTGRES_IO_METHOD:-worker}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-originpulse}
      POSTGRES_USER: ${POSTGRES_USER:-originpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-originpulse_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
      start_interval: 1s

  originpulse-api:
    <<: *originpulse-service
    environment:
      <<: *originpulse-environment
      PANTHEON_SSH_KEY_PATH: /run/secrets/pantheon_ssh_key
      PANTHEON_KNOWN_HOSTS_PATH: /run/secrets/pantheon_known_hosts
      PANTHEON_AUTO_UPDATE_HOST_KEYS: ${PANTHEON_AUTO_UPDATE_HOST_KEYS:-true}
    secrets:
      - pantheon_ssh_key
      - pantheon_known_hosts
    command: ["api", "-config", "/app/config.yml"]
    ports:
      - "${ORIGINPULSE_BIND_HOST:-127.0.0.1}:${ORIGINPULSE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "originpulse", "healthcheck", "-url", "http://127.0.0.1:8080/health", "-timeout", "5s"]
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 20s
      start_interval: 2s

  originpulse-collector:
    <<: *originpulse-service
    environment:
      <<: *originpulse-environment
      PANTHEON_SSH_KEY_PATH: /run/secrets/pantheon_ssh_key
      PANTHEON_KNOWN_HOSTS_PATH: /run/secrets/pantheon_known_hosts
      PANTHEON_AUTO_UPDATE_HOST_KEYS: ${PANTHEON_AUTO_UPDATE_HOST_KEYS:-true}
    secrets:
      - pantheon_ssh_key
      - pantheon_known_hosts
    command: ["collector-worker", "-config", "/app/config.yml"]

  originpulse-ingest:
    <<: *originpulse-service
    command: ["ingest-worker", "-config", "/app/config.yml", "-interval", "${ORIGINPULSE_INGEST_INTERVAL:-1m}"]

  originpulse-reports:
    <<: *originpulse-service
    command: ["reports-worker", "-config", "/app/config.yml"]

volumes:
  postgres_data:
    name: originpulse-postgres
  originpulse_data:
    name: docker_originpulse_data

secrets:
  pantheon_ssh_key:
    file: ${PANTHEON_SSH_KEY_FILE:?Set PANTHEON_SSH_KEY_FILE to your Pantheon SSH private key path}
  pantheon_known_hosts:
    file: ${PANTHEON_KNOWN_HOSTS_FILE:?Set PANTHEON_KNOWN_HOSTS_FILE to a verified SSH known_hosts file}
